<!--Emmet abbreviation: html:5 är ett hjälpmedel som genererar en grundläggande HTML5-struktur.-->
<!--Info om Emmet: https://emmet.io/-->
<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enkel Bootstrap-övning</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <!-- 
    bg-light är en Bootstrap-klass som ger en ljus bakgrundsfärg till body-elementet.
    text-center är en Bootstrap-klass som centrerar texten horisontellt.
    py-5 är en Bootstrap-klass som ger padding på y-axeln (top och bottom) med värdet 5 (vilket motsvarar 3rem). 
    -->
    <div class="bg-light text-center py-5">
        <h1>Välkommen till vår butik</h1>
        <p>Ett enkelt exempel med Bootstrap 5.</p>
        <button class="btn btn-success">Kom igång nu</button>
    </div>
    <!-- 
    container betyder att innehållet centreras och får en maxbredd beroende på skärmstorlek.
    my-5 betyder margin på y-axeln (top och bottom) med värdet 5 (vilket motsvarar 3rem). 
    -->
    <div class="container my-5">
        <!-- row är en flexbox-container som används för att skapa rader i Bootstrap. -->
        <div class="row">
            <!-- 
            col-12 betyder att kolumnen tar upp hela bredden på skärmen (12 av 12 kolumner).
            col-md-4 betyder att kolumnen tar upp 4 av 12 kolumner på medium och större skärmar.
            På mindre skärmar tar den upp hela bredden (12 av 12). 
            -->
            <div class="col-12 col-md-4">
                <!-- 
                card betyder att innehållet är inneslutet i ett kort med padding och en skugga.
                p-3 betyder padding på alla sidor med värdet 3 (vilket motsvarar 1rem).
                my-2 betyder margin på y-axeln (top och bottom) med värdet 2 (vilket motsvarar 0.5rem). 
                -->
                <div class="card p-3 my-2">
                    <h5>Produkt 1</h5>
                    <p>Det här är det första produktkortet.</p>
                    <!-- 
                    btn är en Bootstrap-klass som gör att länken ser ut som en knapp.
                    btn-primary betyder att knappen får en blå bakgrundsfärg och vit text.
                    -->
                    <a href="#" class="btn btn-primary">Läs mer</a>
                </div>
            </div>

            <div class="col-12 col-md-4">
                <div class="card p-3 my-2">
                    <h5>Produkt 2</h5>
                    <p>Det här är det andra produktkortet.</p>
                    <a href="#" class="btn btn-primary">Läs mer</a>
                </div>
            </div>

            <div class="col-12 col-md-4">
                <div class="card p-3 my-2">
                    <h5>Produkt 3</h5>
                    <p>Det här är det tredje produktkortet.</p>
                    <a href="#" class="btn btn-primary">Läs mer</a>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
